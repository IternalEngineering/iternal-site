name = "client-site-funnel"
main = "worker.js"
compatibility_date = "2026-08-01"
account_id = "65d5b12232edf6944b3c596a887f27d3" # Iternal
routes = [{ pattern = "api.iternal.co.uk", custom_domain = true }]

# Team briefs go out via Cloudflare Email Routing (enabled on iternal.co.uk);
# EVERY address listed here must be a verified destination in Email Routing
# before deploying, and must match TEAM_EMAIL below.
# NB: must sit up here, above every [section] header — anywhere lower, TOML
# swallows it into the preceding table and the binding silently never exists.
# CLIENT_MAIL sends each client their confirmation, with the terms attached,
# once they have paid. It is Cloudflare Email Service, not Email Routing: it reaches
# any address once iternal.co.uk is onboarded as a sending domain (Workers
# Paid plan). It may only send from CLIENT_FROM's address.
# CONTACT_MAIL emails the contact page's enquiries (POST /contact) to
# CONTACT_EMAIL, also Email Routing, so that address must be verified too.
send_email = [
  { name = "TEAM_MAIL", allowed_destination_addresses = ["john@iternal.life"] },
  { name = "CONTACT_MAIL", allowed_destination_addresses = ["paul@iternal.life"] },
  { name = "CLIENT_MAIL", allowed_sender_addresses = ["websites@iternal.co.uk"] },
]

# Create with: wrangler kv namespace create CLIENTS  — then paste the id here.
[[kv_namespaces]]
binding = "CLIENTS"
id = "bf744fdf07b945719b644e314b69b780"

[vars]
SITE_URL = "https://iternal.co.uk"
FROM_EMAIL = "Website Pipeline <funnel@iternal.co.uk>"
# Comma-separated; each gets its own copy of every team brief.
TEAM_EMAIL = "john@iternal.life"
# The client's copy: from an iternal.co.uk address (the sending domain), with
# replies going to the team's mailbox.
CLIENT_FROM = "Iternal <websites@iternal.co.uk>"
CLIENT_REPLY_TO = "john@iternal.life"
# The contact page's enquiries go here, with replies going to the sender.
CONTACT_EMAIL = "paul@iternal.life"
CONTACT_FROM = "Iternal website <contact@iternal.co.uk>"
# The Lead Tracker's public "Anyone" /exec URL:
LEAD_API_URL = "https://script.google.com/macros/s/AKfycbzwkFrrOZ_VqMP0CJnAjtCsUTU6BtOzbLyJ7SClkmaVJq6W3r4FSoxohBPLqZZbrTKI/exec"
# The information & demo build dashboard's repo: the worker commits one
# clients/<slug>.json per client here. Skipped silently until PIPELINE_TOKEN
# is set, so the worker can deploy before the repo exists.
PIPELINE_REPO = "IternalEngineering/website-build-platform"
# The downpayment's Price (price_…) and its 20% VAT tax rate, inclusive
# (txr_…), both made once in Stripe's dashboard. The price's amount must equal
# TERMS.downpayment in worker.js (HOUSEKEEPING.md §Payment).
STRIPE_PRICE = "price_1UTLN4JaKTbTS7qBd2deRD6J"
STRIPE_TAX_RATE = "txr_1UTkLLJaKTbTS7qB9pZbYNzp"
# The booking page (John's schedule, for launch). Its only home: paid
# clients get it from /status on the questions page and in the confirmation email.
BOOKING_URL = "https://calendar.app.google/fNGuEjKBSpoPMhAL6"

# Secrets — set each with: wrangler secret put <NAME>
#   STRIPE_API_KEY         restricted key, Checkout Sessions: Write and nothing else
#   STRIPE_WEBHOOK_SECRET  signing secret of the /stripe-webhook endpoint in Stripe's dashboard
#   LEAD_API_SECRET        from Lead Tracker Admin -> Website leads
#   PIPELINE_TOKEN         fine-grained GitHub token: Contents read+write on PIPELINE_REPO only
#   TURNSTILE_SECRET       the Turnstile widget's secret key: the sign-up's and contact form's
#                          bot check is off until it is set (the site key is in turnstile.js)

# Keep worker logs so a failed sync or send can be found afterwards.
[observability]
enabled = true
